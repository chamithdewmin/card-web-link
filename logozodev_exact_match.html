<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center}
.page{width:100%;max-width:420px;min-height:100vh;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 30px 48px;font-family:'Montserrat',sans-serif}

/* Logo ring */
.logo-ring{width:100px;height:100px;border-radius:50%;border:2.5px solid #3ecf3e;display:flex;align-items:center;justify-content:center;margin-bottom:22px;position:relative;opacity:0;animation:fadeD .6s .05s ease forwards}
.logo-inner{display:flex;align-items:center;justify-content:center}
.lz-svg{width:52px;height:42px}

/* Brand name */
.brand{font-size:28px;font-weight:800;letter-spacing:4px;color:#fff;text-transform:uppercase;margin-bottom:6px;opacity:0;animation:fadeD .6s .15s ease forwards}
.brand em{color:#3ecf3e;font-style:normal}

/* Underline */
.underline{width:44px;height:2px;background:#3ecf3e;margin-bottom:10px;opacity:0;animation:fadeD .6s .2s ease forwards}

/* Tagline */
.tagline{font-size:9px;font-weight:400;letter-spacing:4px;color:#888;text-transform:uppercase;margin-bottom:44px;opacity:0;animation:fadeD .6s .25s ease forwards}
.tagline span{color:#3ecf3e;margin:0 6px;font-size:8px}

/* Links */
.links{width:100%;display:flex;flex-direction:column;gap:4px}

.link{display:flex;align-items:center;text-decoration:none;padding:14px 0;border-bottom:1px solid #1e1e1e;opacity:0;animation:fadeU .5s ease forwards;transition:background .2s}
.link:first-child{border-top:1px solid #1e1e1e}
.link:hover{background:rgba(62,207,62,0.04)}

.link:nth-child(1){animation-delay:.35s}
.link:nth-child(2){animation-delay:.43s}
.link:nth-child(3){animation-delay:.51s}
.link:nth-child(4){animation-delay:.59s}
.link:nth-child(5){animation-delay:.67s}

/* Icon circle */
.icon-wrap{width:42px;height:42px;border-radius:50%;border:2px solid #3ecf3e;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:4px;transition:background .25s,border-color .25s}
.link:hover .icon-wrap{background:rgba(62,207,62,0.1)}
.icon-wrap svg{width:18px;height:18px;fill:#fff;transition:fill .25s}

/* Divider */
.divider{width:1.5px;height:36px;background:#2a2a2a;margin:0 22px;flex-shrink:0}

/* Label */
.label{font-size:11px;font-weight:600;letter-spacing:5px;color:#ccc;text-transform:uppercase;transition:color .25s}
.link:hover .label{color:#fff}

/* Footer */
.footer{margin-top:40px;display:flex;align-items:center;gap:7px;opacity:0;animation:fadeU .5s .8s ease forwards}
.footer svg{width:13px;height:13px;fill:#555}
.footer a{font-size:10px;color:#555;letter-spacing:2px;text-decoration:none;font-weight:400;transition:color .2s}
.footer a:hover{color:#3ecf3e}

@keyframes fadeD{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeU{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:380px){.page{padding:50px 20px 36px}.brand{font-size:22px;letter-spacing:3px}.label{letter-spacing:4px}}
</style>
