# App is served at https://<host>/weblink/ (Dokploy path + internal /).
# Assets from Vite use base /weblink/

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /weblink {
        return 301 /weblink/;
    }

    location /weblink/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /weblink/index.html;
    }

    location = / {
        return 301 /weblink/;
    }

    location / {
        return 404;
    }

    location ~* ^/weblink/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }
}
